<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Reverence Party Progress">
  <title>Reverence Party Progress – Valiant 9</title>

  <style>
    * { -webkit-user-select:none; -webkit-touch-callout:none; user-select:none; box-sizing:border-box; }

    html, body {
      width: 100%; height: 100%; margin: 0; padding: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      overflow:hidden;
    }

    .container {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      width:100%; height:100%; padding:20px; gap:20px;
    }

    h1 {
      color:white; font-size:28px; font-weight:700; margin:0;
      text-shadow:0 2px 10px rgba(0,0,0,0.2);
      text-align:center; line-height:1.15;
    }

    .pizza-container {
      position:relative; width:320px; height:320px;
      filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.3));
    }

    svg { width:100%; height:100%; display:block; touch-action:manipulation; }

    .slice-hit {
      cursor:pointer; -webkit-tap-highlight-color:transparent;
      pointer-events:all;
      fill: rgba(0,0,0,0.001);
      stroke: rgba(0,0,0,0.001);
      stroke-width: 18;
      paint-order: stroke fill;
    }

    .counter {
      color:white; font-size:18px; font-weight:600;
      text-shadow:0 2px 8px rgba(0,0,0,0.2);
    }

    .button-group { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }

    button {
      padding:14px 28px; font-size:16px; font-weight:700;
      border:none; border-radius:12px; cursor:pointer;
      transition:all 0.2s ease;
      -webkit-appearance:none; appearance:none;
      min-width:120px;
    }

    #btnReset { background:#ff6b6b; color:white; box-shadow:0 4px 15px rgba(255,107,107,0.3); }
    #btnReset:active { transform:scale(0.97); box-shadow:0 2px 8px rgba(255,107,107,0.3); }

    #btnFill { background:#51cf66; color:white; box-shadow:0 4px 15px rgba(81,207,102,0.3); }
    #btnFill:active { transform:scale(0.97); box-shadow:0 2px 8px rgba(81,207,102,0.3); }

    .modal-overlay {
      display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7);
      z-index:1000; align-items:center; justify-content:center; padding:20px;
      animation: fadeIn 0.3s ease;
    }
    .modal-overlay.show { display:flex; }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }

    .modal-content {
      background:white; border-radius:20px; padding:40px 30px;
      text-align:center; max-width:420px; width:min(420px, 92vw);
      box-shadow:0 20px 60px rgba(0,0,0,0.3);
      animation: slideUp 0.4s ease;
      position:relative; z-index:1001;
    }
    @keyframes slideUp { from{transform:translateY(50px);opacity:0} to{transform:translateY(0);opacity:1} }

    .modal-content h2 { font-size:34px; margin:0 0 10px; color:#333; line-height:1.1; }
    .modal-content .celebration-text { font-size:22px; margin:18px 0; color:#555; }
    .modal-content .button-group { margin-top:26px; }
    .modal-content button { min-width:150px; }

    #btnClose { background:#4c6ef5; color:white; box-shadow:0 4px 15px rgba(76,110,245,0.3); }
    #btnClose:active { transform:scale(0.97); box-shadow:0 2px 8px rgba(76,110,245,0.3); }

    #btnResetModal { background:#ff6b6b; color:white; box-shadow:0 4px 15px rgba(255,107,107,0.3); }
    #btnResetModal:active { transform:scale(0.97); box-shadow:0 2px 8px rgba(255,107,107,0.3); }

    .confetti { position:fixed; pointer-events:none; z-index:1002; }
    @keyframes confettiFall {
      to { transform: translateY(100vh) rotate(720deg); opacity:0; }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🎉 Reverence Party Progress<br>Valiant 9</h1>

    <div class="pizza-container">
      <svg id="pizzaSvg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pizza progress tracker">
        <defs>
          <radialGradient id="cheeseGradient" cx="40%" cy="40%">
            <stop offset="0%" stop-color="#f7dc6f" />
            <stop offset="65%" stop-color="#f39c12" />
            <stop offset="100%" stop-color="#d68910" />
          </radialGradient>

          <radialGradient id="crustGradient" cx="45%" cy="40%" r="75%">
            <stop offset="0%" stop-color="#d8a36b" />
            <stop offset="100%" stop-color="#a7774c" />
          </radialGradient>

          <radialGradient id="sauceGradient" cx="45%" cy="45%" r="75%">
            <stop offset="0%" stop-color="#e25545" />
            <stop offset="100%" stop-color="#b4342a" />
          </radialGradient>

          <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.18" />
          </filter>

          <!-- Dynamic clipPaths injected here -->
          <g id="dynDefs"></g>
        </defs>

        <!-- plate -->
        <circle cx="100" cy="100" r="98" fill="rgba(255,255,255,0.14)"></circle>

        <!-- crust + sauce base -->
        <g filter="url(#softShadow)">
          <circle cx="100" cy="100" r="95" fill="url(#crustGradient)"></circle>
          <circle cx="100" cy="100" r="84" fill="url(#sauceGradient)"></circle>
        </g>

        <g id="slicesLayer"></g>
        <g id="dividersLayer"></g>

        <!-- center highlight -->
        <circle cx="100" cy="100" r="10" fill="rgba(255,255,255,0.35)"></circle>
      </svg>
    </div>

    <div class="counter"><span id="filledCount">0</span> / 10 slices</div>

    <div class="button-group">
      <button id="btnReset">Reset</button>
      <button id="btnFill">Fill All</button>
    </div>
  </div>

  <div class="modal-overlay" id="completionModal">
    <div class="modal-content">
      <h2>🎉 Party time,<br>Valiant 9!</h2>
      <div class="celebration-text">🍕 All slices colored!</div>
      <div class="button-group">
        <button id="btnClose">Close</button>
        <button id="btnResetModal">Reset for next time</button>
      </div>
    </div>
  </div>

  <script>
    // ===========================
    // Constants & State
    // ===========================
    const NUM_SLICES = 10;
    const STORAGE_KEY = "pizzaSliceStates_v4";

    // SVG geometry
    const CX = 100, CY = 100;
    const R_OUTER = 84; // cheese edge
    const R_INNER = 12; // hub to avoid sharp point

    const START_OFFSET = -Math.PI / 2;          // slice 0 at top
    const STEP = (2 * Math.PI) / NUM_SLICES;

    // DOM
    const filledCountSpan = document.getElementById("filledCount");
    const btnReset = document.getElementById("btnReset");
    const btnFill = document.getElementById("btnFill");
    const btnClose = document.getElementById("btnClose");
    const btnResetModal = document.getElementById("btnResetModal");
    const completionModal = document.getElementById("completionModal");

    const dynDefs = document.getElementById("dynDefs");
    const slicesLayer = document.getElementById("slicesLayer");
    const dividersLayer = document.getElementById("dividersLayer");

    function loadSliceStates() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        try {
          const parsed = JSON.parse(stored);
          if (Array.isArray(parsed) && parsed.length === NUM_SLICES) return parsed.map(Boolean);
        } catch (_) {}
      }
      return Array(NUM_SLICES).fill(false);
    }
    function saveSliceStates(states) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(states));
    }
    let states = loadSliceStates();

    // ===========================
    // SVG helpers
    // ===========================
    function makeSVG(tag) {
      return document.createElementNS("http://www.w3.org/2000/svg", tag);
    }
    function polarToXY(cx, cy, r, angleRad) {
      return { x: cx + r * Math.cos(angleRad), y: cy + r * Math.sin(angleRad) };
    }
    function wedgePath(rOuter, rInner, startAngle, endAngle) {
      const p1 = polarToXY(CX, CY, rOuter, startAngle);
      const p2 = polarToXY(CX, CY, rOuter, endAngle);
      const p3 = polarToXY(CX, CY, rInner, endAngle);
      const p4 = polarToXY(CX, CY, rInner, startAngle);
      const largeArc = (endAngle - startAngle) > Math.PI ? 1 : 0;

      return [
        `M ${p1.x} ${p1.y}`,
        `A ${rOuter} ${rOuter} 0 ${largeArc} 1 ${p2.x} ${p2.y}`,
        `L ${p3.x} ${p3.y}`,
        `A ${rInner} ${rInner} 0 ${largeArc} 0 ${p4.x} ${p4.y}`,
        "Z"
      ].join(" ");
    }
    function dividerLine(angleRad) {
      const pOuter = polarToXY(CX, CY, R_OUTER, angleRad);
      const pInner = polarToXY(CX, CY, R_INNER, angleRad);
      return { pOuter, pInner };
    }

    // Deterministic RNG per slice (stable positions)
    function mulberry32(seed) {
      return function() {
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    // ===========================
    // Clean, simple topping shapes (like your reference image)
    // ===========================
    function drawPepperoniOutline(g, x, y, r) {
      const c = makeSVG("circle");
      c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", r);
      g.appendChild(c);
    }
    function drawPepperoniColor(g, x, y, r) {
      const c1 = makeSVG("circle");
      c1.setAttribute("cx", x); c1.setAttribute("cy", y); c1.setAttribute("r", r);
      c1.setAttribute("fill", "#b91c1c");
      c1.setAttribute("opacity", "0.95");
      const c2 = makeSVG("circle");
      c2.setAttribute("cx", x); c2.setAttribute("cy", y); c2.setAttribute("r", r*0.62);
      c2.setAttribute("fill", "#7f1d1d");
      c2.setAttribute("opacity", "0.25");
      g.appendChild(c1); g.appendChild(c2);
    }

    function drawMushroomOutline(g, x, y, s) {
      const cap = makeSVG("path");
      cap.setAttribute("d", `M ${x - s} ${y} Q ${x} ${y - s*0.95} ${x + s} ${y} Q ${x} ${y + s*0.2} ${x - s} ${y} Z`);
      const stem = makeSVG("path");
      stem.setAttribute("d", `M ${x - s*0.33} ${y} Q ${x} ${y + s*1.0} ${x + s*0.33} ${y} Z`);
      g.appendChild(cap); g.appendChild(stem);
    }
    function drawMushroomColor(g, x, y, s) {
      const cap = makeSVG("path");
      cap.setAttribute("d", `M ${x - s} ${y} Q ${x} ${y - s*0.95} ${x + s} ${y} Q ${x} ${y + s*0.2} ${x - s} ${y} Z`);
      cap.setAttribute("fill", "#c7b299");
      const stem = makeSVG("path");
      stem.setAttribute("d", `M ${x - s*0.33} ${y} Q ${x} ${y + s*1.0} ${x + s*0.33} ${y} Z`);
      stem.setAttribute("fill", "#ead9c4");
      g.appendChild(cap); g.appendChild(stem);
    }

    function drawChunkOutline(g, x, y, s) {
      // small rounded triangle-ish blob (like cheese chunk / onion chunk in coloring pages)
      const p = makeSVG("path");
      p.setAttribute("d", `M ${x} ${y-s}
        Q ${x+s} ${y-s*0.2} ${x+s*0.55} ${y+s*0.75}
        Q ${x} ${y+s*0.95} ${x-s*0.55} ${y+s*0.75}
        Q ${x-s} ${y-s*0.2} ${x} ${y-s} Z`);
      g.appendChild(p);
    }
    function drawChunkColor(g, x, y, s) {
      const p = makeSVG("path");
      p.setAttribute("d", `M ${x} ${y-s}
        Q ${x+s} ${y-s*0.2} ${x+s*0.55} ${y+s*0.75}
        Q ${x} ${y+s*0.95} ${x-s*0.55} ${y+s*0.75}
        Q ${x-s} ${y-s*0.2} ${x} ${y-s} Z`);
      p.setAttribute("fill", "#16a34a");
      p.setAttribute("opacity", "0.9");
      g.appendChild(p);
    }

    // ===========================
    // Placement with spacing (prevents overlap / clumps)
    // ===========================
    function placeNonOverlappingPoints(rnd, sliceIndex, count, minDist) {
      const points = [];
      const a1 = START_OFFSET + sliceIndex * STEP;
      const a2 = START_OFFSET + (sliceIndex + 1) * STEP;

      // keep inside wedge with margins
      const angMin = a1 + 0.18 * STEP;
      const angMax = a2 - 0.18 * STEP;
      const radMin = R_INNER + 18;
      const radMax = R_OUTER - 18;

      let attempts = 0;
      const maxAttempts = 350;

      while (points.length < count && attempts < maxAttempts) {
        attempts++;

        // sample angle uniformly within wedge
        const ang = angMin + rnd() * (angMax - angMin);

        // sample radius with sqrt distribution for more uniform area
        const t = rnd();
        const rad = Math.sqrt(t) * (radMax - radMin) + radMin;

        const x = CX + rad * Math.cos(ang);
        const y = CY + rad * Math.sin(ang);

        let ok = true;
        for (const p of points) {
          const dx = p.x - x, dy = p.y - y;
          if ((dx*dx + dy*dy) < (minDist*minDist)) { ok = false; break; }
        }
        if (ok) points.push({ x, y });
      }

      return points;
    }

    function buildToppingsForSlice(sliceIndex, clipId, filled) {
      const outer = makeSVG("g");
      outer.setAttribute("clip-path", `url(#${clipId})`);

      // Sauce tint under cheese when filled
      const sauceTint = makeSVG("path");
      sauceTint.setAttribute("fill", "url(#sauceGradient)");
      sauceTint.setAttribute("opacity", filled ? "0.18" : "0");
      outer.appendChild(sauceTint);

      // Outline group = coloring book
      const outlineG = makeSVG("g");
      outlineG.setAttribute("fill", "none");
      outlineG.setAttribute("stroke", "#111");
      outlineG.setAttribute("stroke-width", "1.7");
      outlineG.setAttribute("opacity", filled ? "0" : "0.85");

      // Color group
      const colorG = makeSVG("g");
      colorG.setAttribute("opacity", filled ? "1" : "0");

      // Stable RNG per slice
      const rnd = mulberry32(13579 + sliceIndex * 999);

      // 6–8 items per slice, spaced out
      const itemCount = 6 + Math.floor(rnd() * 3);
      const pts = placeNonOverlappingPoints(rnd, sliceIndex, itemCount, 14);

      // For each point, pick a simple topping type
      for (let i = 0; i < pts.length; i++) {
        const { x, y } = pts[i];
        const roll = rnd();

        if (roll < 0.50) {
          // Pepperoni
          const r = 6 + rnd() * 2;
          drawPepperoniOutline(outlineG, x, y, r);
          if (filled) drawPepperoniColor(colorG, x, y, r);

        } else if (roll < 0.78) {
          // Mushroom
          const s = 7 + rnd() * 2.5;
          drawMushroomOutline(outlineG, x, y, s);
          if (filled) drawMushroomColor(colorG, x, y, s);

        } else {
          // Chunk blob (pepper/cheese chunk)
          const s = 4.5 + rnd() * 2.0;
          drawChunkOutline(outlineG, x, y, s);
          if (filled) drawChunkColor(colorG, x, y, s);
        }
      }

      outer.appendChild(colorG);
      outer.appendChild(outlineG);

      return { group: outer, sauceTint };
    }

    // ===========================
    // Render
    // ===========================
    function render() {
      dynDefs.textContent = "";
      slicesLayer.textContent = "";
      dividersLayer.textContent = "";

      for (let i = 0; i < NUM_SLICES; i++) {
        const a1 = START_OFFSET + i * STEP;
        const a2 = START_OFFSET + (i + 1) * STEP;

        // Clip path
        const clipId = `clip_slice_${i}`;
        const clip = makeSVG("clipPath");
        clip.setAttribute("id", clipId);
        const clipShape = makeSVG("path");
        clipShape.setAttribute("d", wedgePath(R_OUTER, R_INNER, a1, a2));
        clip.appendChild(clipShape);
        dynDefs.appendChild(clip);

        const sliceGroup = makeSVG("g");
        sliceGroup.setAttribute("data-index", String(i));

        // Base wedge
        const base = makeSVG("path");
        base.setAttribute("d", wedgePath(R_OUTER, R_INNER, a1, a2));
        base.setAttribute("fill", states[i] ? "url(#cheeseGradient)" : "white");
        base.setAttribute("stroke", "black");
        base.setAttribute("stroke-width", "1.5");
        base.setAttribute("stroke-linejoin", "round");
        base.setAttribute("clip-path", `url(#${clipId})`);
        sliceGroup.appendChild(base);

        // Toppings
        const toppings = buildToppingsForSlice(i, clipId, states[i]);
        toppings.sauceTint.setAttribute("d", wedgePath(R_OUTER, R_INNER, a1, a2));
        sliceGroup.appendChild(toppings.group);

        // Tap target
        const hit = makeSVG("path");
        hit.setAttribute("d", wedgePath(R_OUTER, R_INNER, a1, a2));
        hit.setAttribute("class", "slice-hit");
        hit.setAttribute("aria-label", `Slice ${i + 1}`);
        hit.setAttribute("role", "button");
        hit.setAttribute("tabindex", "0");

        const toggle = () => {
          states[i] = !states[i];
          saveSliceStates(states);
          updateCountDisplay();
          render();
          checkCompletion();
        };

        hit.addEventListener("click", toggle);
        hit.addEventListener("touchstart", (e) => { e.preventDefault(); toggle(); }, { passive: false });
        hit.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
        });

        sliceGroup.appendChild(hit);
        slicesLayer.appendChild(sliceGroup);

        // Divider
        const { pOuter, pInner } = dividerLine(a1);
        const line = makeSVG("line");
        line.setAttribute("x1", pInner.x);
        line.setAttribute("y1", pInner.y);
        line.setAttribute("x2", pOuter.x);
        line.setAttribute("y2", pOuter.y);
        line.setAttribute("stroke", "black");
        line.setAttribute("stroke-width", "1.2");
        line.setAttribute("opacity", "0.55");
        dividersLayer.appendChild(line);
      }

      // Last divider
      const lastA = START_OFFSET + NUM_SLICES * STEP;
      const { pOuter, pInner } = dividerLine(lastA);
      const lastLine = makeSVG("line");
      lastLine.setAttribute("x1", pInner.x);
      lastLine.setAttribute("y1", pInner.y);
      lastLine.setAttribute("x2", pOuter.x);
      lastLine.setAttribute("y2", pOuter.y);
      lastLine.setAttribute("stroke", "black");
      lastLine.setAttribute("stroke-width", "1.2");
      lastLine.setAttribute("opacity", "0.55");
      dividersLayer.appendChild(lastLine);
    }

    // ===========================
    // UI / Completion / Confetti
    // ===========================
    function updateCountDisplay() {
      const filledCount = states.filter(Boolean).length;
      filledCountSpan.textContent = filledCount;
      return filledCount;
    }

    function checkCompletion() {
      if (states.every(Boolean)) showCompletionModal();
    }

    function showCompletionModal() {
      completionModal.classList.add("show");
      triggerConfetti();
    }

    function closeModal() { completionModal.classList.remove("show"); }

    function resetPizza() {
      states = Array(NUM_SLICES).fill(false);
      saveSliceStates(states);
      updateCountDisplay();
      closeModal();
      render();
    }

    function fillAllSlices() {
      states = Array(NUM_SLICES).fill(true);
      saveSliceStates(states);
      updateCountDisplay();
      render();
      checkCompletion();
    }

    btnReset.addEventListener("click", resetPizza);
    btnFill.addEventListener("click", fillAllSlices);
    btnClose.addEventListener("click", closeModal);
    btnResetModal.addEventListener("click", resetPizza);

    function triggerConfetti() {
      document.querySelectorAll(".confetti").forEach(el => el.remove());
      const colors = ["#ff6b6b","#51cf66","#4c6ef5","#ffd43b","#ff922b"];
      const confettiPieces = 55;

      for (let i = 0; i < confettiPieces; i++) {
        setTimeout(() => {
          const c = document.createElement("div");
          c.className = "confetti";
          c.textContent = Math.random() > 0.5 ? "🎉" : "🎊";
          c.style.left = (Math.random() * window.innerWidth) + "px";
          c.style.top = "-12px";
          c.style.color = colors[Math.floor(Math.random() * colors.length)];
          c.style.fontSize = (Math.random() * 18 + 18) + "px";
          c.style.opacity = "1";
          c.style.animation = `confettiFall ${Math.random() * 2 + 2.2}s ease-out forwards`;
          c.style.transform = `rotate(${Math.random() * 360}deg)`;
          document.body.appendChild(c);
          setTimeout(() => c.remove(), 3600);
        }, i * 28);
      }
    }

    // Init
    updateCountDisplay();
    render();
    checkCompletion();
  </script>
</body>
</html>
