<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Reverence Party Progress">
  <title>Reverence Party Progress – Valiant 9</title>

  <style>
    * { -webkit-user-select:none; -webkit-touch-callout:none; user-select:none; box-sizing:border-box; }

    html, body {
      width:100%; height:100%; margin:0; padding:0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      overflow:hidden;
    }

    .container {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      width:100%; height:100%; padding:20px; gap:20px;
    }

    h1 {
      color:white; font-size:28px; font-weight:800; margin:0;
      text-shadow:0 2px 10px rgba(0,0,0,0.2);
      text-align:center; line-height:1.15;
    }

    .pizza-container {
      position:relative; width:320px; height:320px;
      filter: drop-shadow(0 10px 25px rgba(0,0,0,0.30));
    }

    svg { width:100%; height:100%; display:block; touch-action:manipulation; }

    /* Big invisible tap target per slice */
    .slice-hit {
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      pointer-events:all;
      fill: rgba(0,0,0,0.001);
      stroke: rgba(0,0,0,0.001);
      stroke-width: 22;       /* makes center easy to tap */
      stroke-linejoin: round;
      paint-order: stroke fill;
    }

    .counter {
      color:white; font-size:18px; font-weight:700;
      text-shadow:0 2px 8px rgba(0,0,0,0.2);
    }

    .button-group { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }

    button {
      padding:14px 28px; font-size:16px; font-weight:800;
      border:none; border-radius:12px; cursor:pointer;
      transition:all 0.2s ease;
      -webkit-appearance:none; appearance:none;
      min-width:120px;
    }

    #btnReset { background:#ff6b6b; color:white; box-shadow:0 4px 15px rgba(255,107,107,0.3); }
    #btnReset:active { transform:scale(0.97); box-shadow:0 2px 8px rgba(255,107,107,0.3); }

    #btnFill { background:#51cf66; color:white; box-shadow:0 4px 15px rgba(81,207,102,0.3); }
    #btnFill:active { transform:scale(0.97); box-shadow:0 2px 8px rgba(81,207,102,0.3); }

    .modal-overlay {
      display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7);
      z-index:1000; align-items:center; justify-content:center; padding:20px;
      animation: fadeIn 0.3s ease;
    }
    .modal-overlay.show { display:flex; }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }

    .modal-content {
      background:white; border-radius:20px; padding:40px 30px;
      text-align:center; max-width:420px; width:min(420px, 92vw);
      box-shadow:0 20px 60px rgba(0,0,0,0.3);
      animation: slideUp 0.4s ease;
      position:relative; z-index:1001;
    }
    @keyframes slideUp { from{transform:translateY(50px);opacity:0} to{transform:translateY(0);opacity:1} }

    .modal-content h2 { font-size:34px; margin:0 0 10px; color:#333; line-height:1.1; }
    .modal-content .celebration-text { font-size:22px; margin:18px 0; color:#555; }
    .modal-content .button-group { margin-top:26px; }
    .modal-content button { min-width:150px; }

    #btnClose { background:#4c6ef5; color:white; box-shadow:0 4px 15px rgba(76,110,245,0.3); }
    #btnClose:active { transform:scale(0.97); box-shadow:0 2px 8px rgba(76,110,245,0.3); }

    #btnResetModal { background:#ff6b6b; color:white; box-shadow:0 4px 15px rgba(255,107,107,0.3); }
    #btnResetModal:active { transform:scale(0.97); box-shadow:0 2px 8px rgba(255,107,107,0.3); }

    .confetti { position:fixed; pointer-events:none; z-index:1002; }
    @keyframes confettiFall { to { transform: translateY(100vh) rotate(720deg); opacity:0; } }
  </style>
</head>

<body>
  <div class="container">
    <h1>🎉 Reverence Party Progress<br>Valiant 9</h1>

    <div class="pizza-container">
      <svg id="pizzaSvg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pizza progress tracker">
        <defs>
          <radialGradient id="cheeseGradient" cx="40%" cy="40%">
            <stop offset="0%" stop-color="#f7dc6f" />
            <stop offset="65%" stop-color="#f39c12" />
            <stop offset="100%" stop-color="#d68910" />
          </radialGradient>

          <radialGradient id="crustGradient" cx="45%" cy="40%" r="75%">
            <stop offset="0%" stop-color="#d8a36b" />
            <stop offset="100%" stop-color="#a7774c" />
          </radialGradient>

          <radialGradient id="sauceGradient" cx="45%" cy="45%" r="75%">
            <stop offset="0%" stop-color="#e25545" />
            <stop offset="100%" stop-color="#b4342a" />
          </radialGradient>

          <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.18" />
          </filter>

          <!-- clipPaths injected here -->
          <g id="dynDefs"></g>
        </defs>

        <!-- plate -->
        <circle cx="100" cy="100" r="98" fill="rgba(255,255,255,0.14)"></circle>

        <!-- crust + sauce base -->
        <g filter="url(#softShadow)">
          <circle cx="100" cy="100" r="95" fill="url(#crustGradient)"></circle>
          <circle cx="100" cy="100" r="84" fill="url(#sauceGradient)"></circle>
        </g>

        <!-- Layers -->
        <g id="sliceBaseLayer"></g>      <!-- white/cheese fills (per slice) -->
        <g id="coloredToppingsLayer"></g><!-- colored fills clipped to earned slices -->
        <g id="outlineLayer"></g>        <!-- ONE global coloring-page outline on top -->
        <g id="dividerLayer"></g>        <!-- slice lines -->
        <g id="hitLayer"></g>            <!-- tap targets -->
      </svg>
    </div>

    <div class="counter"><span id="filledCount">0</span> / 10 slices</div>

    <div class="button-group">
      <button id="btnReset">Reset</button>
      <button id="btnFill">Fill All</button>
    </div>
  </div>

  <div class="modal-overlay" id="completionModal">
    <div class="modal-content">
      <h2>🎉 Party time,<br>Valiant 9!</h2>
      <div class="celebration-text">🍕 All slices colored!</div>
      <div class="button-group">
        <button id="btnClose">Close</button>
        <button id="btnResetModal">Reset for next time</button>
      </div>
    </div>
  </div>

  <script>
    // ===========================
    // Constants & State
    // ===========================
    const NUM_SLICES = 10;
    const STORAGE_KEY = "pizzaSliceStates_final_v1";

    // Geometry
    const CX = 100, CY = 100;
    const R_PIZZA = 84;        // cheese edge
    const R_CHEESE_WAVY = 78;  // wavy inner boundary
    const START_OFFSET = -Math.PI / 2;
    const STEP = (2 * Math.PI) / NUM_SLICES;

    // Crust rings (outline look like coloring page)
    const R_CRUST_OUT = 95;
    const R_CRUST_IN  = 84;

    // DOM
    const dynDefs = document.getElementById("dynDefs");
    const sliceBaseLayer = document.getElementById("sliceBaseLayer");
    const coloredToppingsLayer = document.getElementById("coloredToppingsLayer");
    const outlineLayer = document.getElementById("outlineLayer");
    const dividerLayer = document.getElementById("dividerLayer");
    const hitLayer = document.getElementById("hitLayer");

    const filledCountSpan = document.getElementById("filledCount");
    const btnReset = document.getElementById("btnReset");
    const btnFill = document.getElementById("btnFill");
    const btnClose = document.getElementById("btnClose");
    const btnResetModal = document.getElementById("btnResetModal");
    const completionModal = document.getElementById("completionModal");

    function loadSliceStates() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        try {
          const parsed = JSON.parse(stored);
          if (Array.isArray(parsed) && parsed.length === NUM_SLICES) return parsed.map(Boolean);
        } catch (_) {}
      }
      return Array(NUM_SLICES).fill(false);
    }
    function saveSliceStates(states) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(states));
    }
    let states = loadSliceStates();

    // ===========================
    // SVG helpers
    // ===========================
    function makeSVG(tag) {
      return document.createElementNS("http://www.w3.org/2000/svg", tag);
    }
    function polarToXY(r, a) {
      return { x: CX + r * Math.cos(a), y: CY + r * Math.sin(a) };
    }

    // Wedge that goes to an actual point in the center
    function wedgePathPointCenter(rOuter, startAngle, endAngle) {
      const p1 = polarToXY(rOuter, startAngle);
      const p2 = polarToXY(rOuter, endAngle);
      const largeArc = (endAngle - startAngle) > Math.PI ? 1 : 0;
      return [
        `M ${CX} ${CY}`,
        `L ${p1.x} ${p1.y}`,
        `A ${rOuter} ${rOuter} 0 ${largeArc} 1 ${p2.x} ${p2.y}`,
        "Z"
      ].join(" ");
    }

    // ===========================
    // Deterministic RNG (stable drawing)
    // ===========================
    function mulberry32(seed) {
      return function() {
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    // ===========================
    // Coloring-page outline: crust rings + wavy cheese edge
    // ===========================
    function buildWavyCheeseEdgePath(r, bumps) {
      const pts = [];
      const total = bumps * 2;
      for (let i = 0; i <= total; i++) {
        const t = (i / total) * (Math.PI * 2);
        const wobble = (i % 2 === 0) ? 3.8 : -3.2;
        const rr = r + wobble;
        pts.push(polarToXY(rr, t));
      }
      let d = `M ${pts[0].x} ${pts[0].y}`;
      for (let i = 1; i < pts.length; i++) {
        const prev = pts[i - 1];
        const cur  = pts[i];
        const midX = (prev.x + cur.x) / 2;
        const midY = (prev.y + cur.y) / 2;
        d += ` Q ${prev.x} ${prev.y} ${midX} ${midY}`;
      }
      d += " Z";
      return d;
    }

    // ===========================
    // Global toppings (single layout across whole pizza)
    // ===========================
    function dist2(a, b) {
      const dx = a.x - b.x, dy = a.y - b.y;
      return dx*dx + dy*dy;
    }

    function generateGlobalToppings() {
      const rnd = mulberry32(424242); // stable across reloads
      const toppings = [];

      // A clean, coloring-page amount of toppings (not overcrowded)
      const target = 18; // adjust if you want more/less
      const minDist = 16; // keeps spacing clean

      let attempts = 0;
      while (toppings.length < target && attempts < 2000) {
        attempts++;

        // sample angle uniformly
        const ang = rnd() * Math.PI * 2;

        // sample radius with sqrt distribution for even area coverage
        const t = rnd();
        const rMin = 18;
        const rMax = R_CHEESE_WAVY - 10;
        const rad = Math.sqrt(t) * (rMax - rMin) + rMin;

        const p = polarToXY(rad, ang);

        // collision avoid
        let ok = true;
        for (const existing of toppings) {
          if (dist2(p, existing) < (minDist*minDist)) { ok = false; break; }
        }
        if (!ok) continue;

        // choose a topping type that matches the reference vibe
        const roll = rnd();
        let type = "pepperoni";
        if (roll < 0.55) type = "pepperoni";
        else if (roll < 0.80) type = "mushroom";
        else type = "chunk";

        // sizes
        let size = 7;
        if (type === "pepperoni") size = 7 + rnd()*1.5;
        if (type === "mushroom")  size = 8 + rnd()*2.0;
        if (type === "chunk")     size = 5 + rnd()*2.0;

        toppings.push({ x: p.x, y: p.y, type, size });
      }

      return toppings;
    }

    const GLOBAL_TOPPINGS = generateGlobalToppings();

    // Shape drawing (outline + color)
    function pepperoniOutline(g, x, y, r) {
      const c = makeSVG("circle");
      c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", r);
      g.appendChild(c);
    }
    function pepperoniColor(g, x, y, r) {
      const c1 = makeSVG("circle");
      c1.setAttribute("cx", x); c1.setAttribute("cy", y); c1.setAttribute("r", r);
      c1.setAttribute("fill", "#b91c1c");
      c1.setAttribute("opacity", "0.95");

      const c2 = makeSVG("circle");
      c2.setAttribute("cx", x); c2.setAttribute("cy", y); c2.setAttribute("r", r * 0.62);
      c2.setAttribute("fill", "#7f1d1d");
      c2.setAttribute("opacity", "0.25");

      g.appendChild(c1); g.appendChild(c2);
    }

    function mushroomOutline(g, x, y, s) {
      const cap = makeSVG("path");
      cap.setAttribute("d", `M ${x - s} ${y} Q ${x} ${y - s*0.95} ${x + s} ${y} Q ${x} ${y + s*0.2} ${x - s} ${y} Z`);
      const stem = makeSVG("path");
      stem.setAttribute("d", `M ${x - s*0.33} ${y} Q ${x} ${y + s*1.0} ${x + s*0.33} ${y} Z`);
      g.appendChild(cap); g.appendChild(stem);
    }
    function mushroomColor(g, x, y, s) {
      const cap = makeSVG("path");
      cap.setAttribute("d", `M ${x - s} ${y} Q ${x} ${y - s*0.95} ${x + s} ${y} Q ${x} ${y + s*0.2} ${x - s} ${y} Z`);
      cap.setAttribute("fill", "#c7b299");

      const stem = makeSVG("path");
      stem.setAttribute("d", `M ${x - s*0.33} ${y} Q ${x} ${y + s*1.0} ${x + s*0.33} ${y} Z`);
      stem.setAttribute("fill", "#ead9c4");

      g.appendChild(cap); g.appendChild(stem);
    }

    function chunkOutline(g, x, y, s) {
      const p = makeSVG("path");
      p.setAttribute("d", `M ${x} ${y-s}
        Q ${x+s} ${y-s*0.2} ${x+s*0.55} ${y+s*0.75}
        Q ${x} ${y+s*0.95} ${x-s*0.55} ${y+s*0.75}
        Q ${x-s} ${y-s*0.2} ${x} ${y-s} Z`);
      g.appendChild(p);
    }
    function chunkColor(g, x, y, s) {
      const p = makeSVG("path");
      p.setAttribute("d", `M ${x} ${y-s}
        Q ${x+s} ${y-s*0.2} ${x+s*0.55} ${y+s*0.75}
        Q ${x} ${y+s*0.95} ${x-s*0.55} ${y+s*0.75}
        Q ${x-s} ${y-s*0.2} ${x} ${y-s} Z`);
      p.setAttribute("fill", "#16a34a");
      p.setAttribute("opacity", "0.9");
      g.appendChild(p);
    }

    function drawToppingOutline(g, t) {
      if (t.type === "pepperoni") pepperoniOutline(g, t.x, t.y, t.size);
      else if (t.type === "mushroom") mushroomOutline(g, t.x, t.y, t.size);
      else chunkOutline(g, t.x, t.y, t.size);
    }

    function drawToppingColor(g, t) {
      if (t.type === "pepperoni") pepperoniColor(g, t.x, t.y, t.size);
      else if (t.type === "mushroom") mushroomColor(g, t.x, t.y, t.size);
      else chunkColor(g, t.x, t.y, t.size);
    }

    // ===========================
    // Render
    // ===========================
    function updateCountDisplay() {
      const filledCount = states.filter(Boolean).length;
      filledCountSpan.textContent = filledCount;
      return filledCount;
    }

    function render() {
      dynDefs.textContent = "";
      sliceBaseLayer.textContent = "";
      coloredToppingsLayer.textContent = "";
      outlineLayer.textContent = "";
      dividerLayer.textContent = "";
      hitLayer.textContent = "";

      // 1) Slice clipPaths + base fills
      for (let i = 0; i < NUM_SLICES; i++) {
        const a1 = START_OFFSET + i * STEP;
        const a2 = START_OFFSET + (i + 1) * STEP;

        // clipPath for this slice
        const clipId = `clip_slice_${i}`;
        const clip = makeSVG("clipPath");
        clip.setAttribute("id", clipId);
        const clipShape = makeSVG("path");
        clipShape.setAttribute("d", wedgePathPointCenter(R_PIZZA, a1, a2));
        clip.appendChild(clipShape);
        dynDefs.appendChild(clip);

        // base fill wedge (white vs cheese)
        const base = makeSVG("path");
        base.setAttribute("d", wedgePathPointCenter(R_PIZZA, a1, a2));
        base.setAttribute("fill", states[i] ? "url(#cheeseGradient)" : "white");
        base.setAttribute("stroke", "none");
        sliceBaseLayer.appendChild(base);

        // colored toppings for this slice (clipped)
        if (states[i]) {
          const coloredGroup = makeSVG("g");
          coloredGroup.setAttribute("clip-path", `url(#${clipId})`);

          // subtle sauce tint under toppings
          const sauce = makeSVG("path");
          sauce.setAttribute("d", wedgePathPointCenter(R_PIZZA, a1, a2));
          sauce.setAttribute("fill", "url(#sauceGradient)");
          sauce.setAttribute("opacity", "0.14");
          coloredGroup.appendChild(sauce);

          // draw ALL global toppings (only the part in this slice will show due to clip)
          for (const t of GLOBAL_TOPPINGS) {
            drawToppingColor(coloredGroup, t);
          }

          coloredToppingsLayer.appendChild(coloredGroup);
        }

        // tap target
        const hit = makeSVG("path");
        hit.setAttribute("d", wedgePathPointCenter(R_PIZZA, a1, a2));
        hit.setAttribute("class", "slice-hit");
        hit.setAttribute("role", "button");
        hit.setAttribute("tabindex", "0");
        hit.setAttribute("aria-label", `Slice ${i + 1}`);

        const toggle = () => {
          states[i] = !states[i];
          saveSliceStates(states);
          updateCountDisplay();
          render();
          checkCompletion();
        };

        hit.addEventListener("click", toggle);
        hit.addEventListener("touchstart", (e) => { e.preventDefault(); toggle(); }, { passive: false });
        hit.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
        });

        hitLayer.appendChild(hit);

        // divider lines (center to crust)
        const pOuter = polarToXY(R_PIZZA, a1);
        const line = makeSVG("line");
        line.setAttribute("x1", CX); line.setAttribute("y1", CY);
        line.setAttribute("x2", pOuter.x); line.setAttribute("y2", pOuter.y);
        line.setAttribute("stroke", "#111");
        line.setAttribute("stroke-width", "1.6");
        line.setAttribute("opacity", "0.8");
        dividerLayer.appendChild(line);
      }

      // 2) Global coloring-page outline ON TOP (single unified drawing)
      // crust rings
      const crustOuter = makeSVG("circle");
      crustOuter.setAttribute("cx", CX);
      crustOuter.setAttribute("cy", CY);
      crustOuter.setAttribute("r", R_CRUST_OUT);
      crustOuter.setAttribute("fill", "none");
      crustOuter.setAttribute("stroke", "#111");
      crustOuter.setAttribute("stroke-width", "1.6");
      crustOuter.setAttribute("opacity", "0.95");
      outlineLayer.appendChild(crustOuter);

      const crustInner = makeSVG("circle");
      crustInner.setAttribute("cx", CX);
      crustInner.setAttribute("cy", CY);
      crustInner.setAttribute("r", R_CRUST_IN);
      crustInner.setAttribute("fill", "none");
      crustInner.setAttribute("stroke", "#111");
      crustInner.setAttribute("stroke-width", "1.4");
      crustInner.setAttribute("opacity", "0.90");
      outlineLayer.appendChild(crustInner);

      // wavy cheese edge
      const cheeseEdge = makeSVG("path");
      cheeseEdge.setAttribute("d", buildWavyCheeseEdgePath(R_CHEESE_WAVY, 10));
      cheeseEdge.setAttribute("fill", "none");
      cheeseEdge.setAttribute("stroke", "#111");
      cheeseEdge.setAttribute("stroke-width", "1.4");
      cheeseEdge.setAttribute("opacity", "0.90");
      outlineLayer.appendChild(cheeseEdge);

      // global topping outlines
      const toppingOutlineG = makeSVG("g");
      toppingOutlineG.setAttribute("fill", "none");
      toppingOutlineG.setAttribute("stroke", "#111");
      toppingOutlineG.setAttribute("stroke-width", "1.7");
      toppingOutlineG.setAttribute("opacity", "0.92");

      for (const t of GLOBAL_TOPPINGS) {
        drawToppingOutline(toppingOutlineG, t);
      }
      outlineLayer.appendChild(toppingOutlineG);

      // pizza rim outline for the cheese circle boundary
      const cheeseBoundary = makeSVG("circle");
      cheeseBoundary.setAttribute("cx", CX);
      cheeseBoundary.setAttribute("cy", CY);
      cheeseBoundary.setAttribute("r", R_PIZZA);
      cheeseBoundary.setAttribute("fill", "none");
      cheeseBoundary.setAttribute("stroke", "#111");
      cheeseBoundary.setAttribute("stroke-width", "1.4");
      cheeseBoundary.setAttribute("opacity", "0.90");
      outlineLayer.appendChild(cheeseBoundary);
    }

    // ===========================
    // Completion + Buttons
    // ===========================
    function checkCompletion() {
      if (states.every(Boolean)) showCompletionModal();
    }
    function showCompletionModal() {
      completionModal.classList.add("show");
      triggerConfetti();
    }
    function closeModal() { completionModal.classList.remove("show"); }

    function resetPizza() {
      states = Array(NUM_SLICES).fill(false);
      saveSliceStates(states);
      updateCountDisplay();
      closeModal();
      render();
    }
    function fillAllSlices() {
      states = Array(NUM_SLICES).fill(true);
      saveSliceStates(states);
      updateCountDisplay();
      render();
      checkCompletion();
    }

    btnReset.addEventListener("click", resetPizza);
    btnFill.addEventListener("click", fillAllSlices);
    btnClose.addEventListener("click", closeModal);
    btnResetModal.addEventListener("click", resetPizza);

    function triggerConfetti() {
      document.querySelectorAll(".confetti").forEach(el => el.remove());
      const colors = ["#ff6b6b","#51cf66","#4c6ef5","#ffd43b","#ff922b"];
      const confettiPieces = 55;

      for (let i = 0; i < confettiPieces; i++) {
        setTimeout(() => {
          const c = document.createElement("div");
          c.className = "confetti";
          c.textContent = Math.random() > 0.5 ? "🎉" : "🎊";
          c.style.left = (Math.random() * window.innerWidth) + "px";
          c.style.top = "-12px";
          c.style.color = colors[Math.floor(Math.random() * colors.length)];
          c.style.fontSize = (Math.random() * 18 + 18) + "px";
          c.style.opacity = "1";
          c.style.animation = `confettiFall ${Math.random() * 2 + 2.2}s ease-out forwards`;
          c.style.transform = `rotate(${Math.random() * 360}deg)`;
          document.body.appendChild(c);
          setTimeout(() => c.remove(), 3600);
        }, i * 28);
      }
    }

    // Init
    updateCountDisplay();
    render();
    checkCompletion();
  </script>
</body>
</html>
