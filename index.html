<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Reverence Party Progress">
  <title>Reverence Party Progress – Valiant 9</title>

  <style>
    * { -webkit-user-select:none; -webkit-touch-callout:none; user-select:none; box-sizing:border-box; }

    html, body {
      width:100%; height:100%; margin:0; padding:0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      overflow:hidden;
    }

    .container {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      width:100%; height:100%; padding:20px; gap:20px;
    }

    h1 {
      color:white; font-size:28px; font-weight:800; margin:0;
      text-shadow:0 2px 10px rgba(0,0,0,0.2);
      text-align:center; line-height:1.15;
    }

    .pizza-container {
      position:relative; width:320px; height:320px;
      filter: drop-shadow(0 10px 25px rgba(0,0,0,0.30));
    }

    svg { width:100%; height:100%; display:block; touch-action:manipulation; }

    .slice-hit {
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      pointer-events:all;
      fill: rgba(0,0,0,0.001);
      stroke: rgba(0,0,0,0.001);
      stroke-width: 22;       /* big tap area */
      stroke-linejoin: round;
      paint-order: stroke fill;
    }

    .counter {
      color:white; font-size:18px; font-weight:700;
      text-shadow:0 2px 8px rgba(0,0,0,0.2);
    }

    .button-group { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }

    button {
      padding:14px 28px; font-size:16px; font-weight:800;
      border:none; border-radius:12px; cursor:pointer;
      transition:all 0.2s ease;
      -webkit-appearance:none; appearance:none;
      min-width:120px;
    }

    #btnReset { background:#ff6b6b; color:white; box-shadow:0 4px 15px rgba(255,107,107,0.3); }
    #btnReset:active { transform:scale(0.97); box-shadow:0 2px 8px rgba(255,107,107,0.3); }

    #btnFill { background:#51cf66; color:white; box-shadow:0 4px 15px rgba(81,207,102,0.3); }
    #btnFill:active { transform:scale(0.97); box-shadow:0 2px 8px rgba(81,207,102,0.3); }

    .modal-overlay {
      display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7);
      z-index:1000; align-items:center; justify-content:center; padding:20px;
      animation: fadeIn 0.3s ease;
    }
    .modal-overlay.show { display:flex; }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }

    .modal-content {
      background:white; border-radius:20px; padding:40px 30px;
      text-align:center; max-width:420px; width:min(420px, 92vw);
      box-shadow:0 20px 60px rgba(0,0,0,0.3);
      animation: slideUp 0.4s ease;
      position:relative; z-index:1001;
    }
    @keyframes slideUp { from{transform:translateY(50px);opacity:0} to{transform:translateY(0);opacity:1} }

    .modal-content h2 { font-size:34px; margin:0 0 10px; color:#333; line-height:1.1; }
    .modal-content .celebration-text { font-size:22px; margin:18px 0; color:#555; }
    .modal-content .button-group { margin-top:26px; }
    .modal-content button { min-width:150px; }

    #btnClose { background:#4c6ef5; color:white; box-shadow:0 4px 15px rgba(76,110,245,0.3); }
    #btnClose:active { transform:scale(0.97); box-shadow:0 2px 8px rgba(76,110,245,0.3); }

    #btnResetModal { background:#ff6b6b; color:white; box-shadow:0 4px 15px rgba(255,107,107,0.3); }
    #btnResetModal:active { transform:scale(0.97); box-shadow:0 2px 8px rgba(255,107,107,0.3); }

    .confetti { position:fixed; pointer-events:none; z-index:1002; }
    @keyframes confettiFall { to { transform: translateY(100vh) rotate(720deg); opacity:0; } }
  </style>
</head>

<body>
  <div class="container">
    <h1>🎉 Reverence Party Progress<br>Valiant 9</h1>

    <div class="pizza-container">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pizza progress tracker">
        <defs>
          <radialGradient id="cheeseGradient" cx="40%" cy="40%">
            <stop offset="0%" stop-color="#f7dc6f" />
            <stop offset="65%" stop-color="#f39c12" />
            <stop offset="100%" stop-color="#d68910" />
          </radialGradient>

          <radialGradient id="crustGradient" cx="45%" cy="40%" r="75%">
            <stop offset="0%" stop-color="#d8a36b" />
            <stop offset="100%" stop-color="#a7774c" />
          </radialGradient>

          <radialGradient id="sauceGradient" cx="45%" cy="45%" r="75%">
            <stop offset="0%" stop-color="#e25545" />
            <stop offset="100%" stop-color="#b4342a" />
          </radialGradient>

          <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.18" />
          </filter>

          <g id="dynDefs"></g>
        </defs>

        <!-- plate -->
        <circle cx="100" cy="100" r="98" fill="rgba(255,255,255,0.14)"></circle>

        <!-- crust + sauce base -->
        <g filter="url(#softShadow)">
          <circle cx="100" cy="100" r="95" fill="url(#crustGradient)"></circle>
          <circle cx="100" cy="100" r="84" fill="url(#sauceGradient)"></circle>
        </g>

        <!-- Layers -->
        <g id="sliceBaseLayer"></g>          <!-- white or cheese per slice -->
        <g id="unfilledPepperoniLayer"></g>  <!-- white-filled pepperoni only for unfilled slices -->
        <g id="coloredPepperoniLayer"></g>   <!-- red pepperoni only for filled slices -->
        <g id="outlineLayer"></g>            <!-- coloring-page outlines (stroke only) -->
        <g id="dividerLayer"></g>
        <g id="hitLayer"></g>
      </svg>
    </div>

    <div class="counter"><span id="filledCount">0</span> / 10 slices</div>

    <div class="button-group">
      <button id="btnReset">Reset</button>
      <button id="btnFill">Fill All</button>
    </div>
  </div>

  <div class="modal-overlay" id="completionModal">
    <div class="modal-content">
      <h2>🎉 Party time,<br>Valiant 9!</h2>
      <div class="celebration-text">🍕 All slices colored!</div>
      <div class="button-group">
        <button id="btnClose">Close</button>
        <button id="btnResetModal">Reset for next time</button>
      </div>
    </div>
  </div>

  <script>
    // ===========================
    // Constants & State
    // ===========================
    const NUM_SLICES = 10;
    const PEPPERONI_PER_SLICE = 3;
    const STORAGE_KEY = "pizzaSliceStates_pepperoni_final";

    const CX = 100, CY = 100;
    const R_PIZZA = 84;
    const R_CHEESE_WAVY = 78;
    const START_OFFSET = -Math.PI / 2;
    const STEP = (2 * Math.PI) / NUM_SLICES;

    const R_CRUST_OUT = 95;
    const R_CRUST_IN  = 84;

    // DOM
    const dynDefs = document.getElementById("dynDefs");
    const sliceBaseLayer = document.getElementById("sliceBaseLayer");
    const unfilledPepperoniLayer = document.getElementById("unfilledPepperoniLayer");
    const coloredPepperoniLayer = document.getElementById("coloredPepperoniLayer");
    const outlineLayer = document.getElementById("outlineLayer");
    const dividerLayer = document.getElementById("dividerLayer");
    const hitLayer = document.getElementById("hitLayer");

    const filledCountSpan = document.getElementById("filledCount");
    const btnReset = document.getElementById("btnReset");
    const btnFill = document.getElementById("btnFill");
    const btnClose = document.getElementById("btnClose");
    const btnResetModal = document.getElementById("btnResetModal");
    const completionModal = document.getElementById("completionModal");

    function loadSliceStates() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        try {
          const parsed = JSON.parse(stored);
          if (Array.isArray(parsed) && parsed.length === NUM_SLICES) return parsed.map(Boolean);
        } catch (_) {}
      }
      return Array(NUM_SLICES).fill(false);
    }
    function saveSliceStates(states) { localStorage.setItem(STORAGE_KEY, JSON.stringify(states)); }

    let states = loadSliceStates();
    let wasAllFilled = states.every(Boolean);

    // ===========================
    // SVG helpers
    // ===========================
    function makeSVG(tag) { return document.createElementNS("http://www.w3.org/2000/svg", tag); }
    function polarToXY(r, a) { return { x: CX + r * Math.cos(a), y: CY + r * Math.sin(a) }; }

    function wedgePathPointCenter(rOuter, startAngle, endAngle) {
      const p1 = polarToXY(rOuter, startAngle);
      const p2 = polarToXY(rOuter, endAngle);
      const largeArc = (endAngle - startAngle) > Math.PI ? 1 : 0;
      return `M ${CX} ${CY} L ${p1.x} ${p1.y} A ${rOuter} ${rOuter} 0 ${largeArc} 1 ${p2.x} ${p2.y} Z`;
    }

    // ===========================
    // Deterministic RNG
    // ===========================
    function mulberry32(seed) {
      return function() {
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function buildWavyCheeseEdgePath(r, bumps) {
      const pts = [];
      const total = bumps * 2;
      for (let i = 0; i <= total; i++) {
        const t = (i / total) * (Math.PI * 2);
        const wobble = (i % 2 === 0) ? 3.8 : -3.2;
        pts.push(polarToXY(r + wobble, t));
      }
      let d = `M ${pts[0].x} ${pts[0].y}`;
      for (let i = 1; i < pts.length; i++) {
        const prev = pts[i - 1], cur = pts[i];
        const midX = (prev.x + cur.x) / 2, midY = (prev.y + cur.y) / 2;
        d += ` Q ${prev.x} ${prev.y} ${midX} ${midY}`;
      }
      return d + " Z";
    }

    // ===========================
    // Pepperoni drawing
    // ===========================
    function pepperoniCircle(g, x, y, r, fill, stroke, strokeWidth) {
      const c = makeSVG("circle");
      c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", r);
      if (fill !== null) c.setAttribute("fill", fill);
      if (stroke) c.setAttribute("stroke", stroke);
      if (strokeWidth) c.setAttribute("stroke-width", strokeWidth);
      g.appendChild(c);
    }

    function pepperoniColor(g, x, y, r) {
      // add a subtle stroke so red pepperoni looks clean against cheese
      pepperoniCircle(g, x, y, r, "#b91c1c", "#111", "0.8");
      pepperoniCircle(g, x, y, r * 0.62, "rgba(127,29,29,0.22)", null, null);
    }

    // ===========================
    // Non-overlapping distribution
    // ===========================
    function distance(a, b) {
      const dx = a.x - b.x, dy = a.y - b.y;
      return Math.sqrt(dx*dx + dy*dy);
    }

    function generatePepperoniPositions() {
      const rnd = mulberry32(909090);
      const positions = [];

      const gap = 2.6;                  // a little more breathing room
      const maxAttemptsPerPep = 1400;

      for (let slice = 0; slice < NUM_SLICES; slice++) {
        const a1 = START_OFFSET + slice * STEP;
        const a2 = START_OFFSET + (slice + 1) * STEP;

        const angMin = a1 + 0.16 * STEP;
        const angMax = a2 - 0.16 * STEP;

        const rMin = 24;
        const rMax = R_CHEESE_WAVY - 14;

        for (let k = 0; k < PEPPERONI_PER_SLICE; k++) {
          let placed = false;

          for (let attempt = 0; attempt < maxAttemptsPerPep && !placed; attempt++) {
            const ang = angMin + rnd() * (angMax - angMin);
            const t = rnd();
            const rad = Math.sqrt(t) * (rMax - rMin) + rMin;

            const p = polarToXY(rad, ang);
            const rPep = 7.2 + rnd() * 1.1;

            let ok = true;
            for (const e of positions) {
              const minDist = (e.r + rPep + gap);
              if (distance(p, e) < minDist) { ok = false; break; }
            }

            if (ok) {
              positions.push({ x: p.x, y: p.y, r: rPep, slice });
              placed = true;
            }
          }

          if (!placed) {
            const midAng = (angMin + angMax) / 2;
            const rad = rMin + (k + 1) * ((rMax - rMin) / (PEPPERONI_PER_SLICE + 1));
            const p = polarToXY(rad, midAng);
            positions.push({ x: p.x, y: p.y, r: 7.4, slice });
          }
        }
      }
      return positions;
    }

    const PEPPERONI_POSITIONS = generatePepperoniPositions();

    // ===========================
    // Audio (iPad unlock + louder longer fanfare)
    // ===========================
    let audioCtx = null;
    let audioUnlocked = false;

    function ensureAudioContext() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        audioCtx = new Ctx();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }
    }

    // Call this on ANY user gesture once, so iOS will allow sound later.
    function unlockAudio() {
      if (audioUnlocked) return;
      ensureAudioContext();

      // play a near-silent click to unlock
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(440, now);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.00001, now + 0.02);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.02);
      } catch (_) {}

      audioUnlocked = true;
    }

    function midiToFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }

    function playFanfare() {
      unlockAudio(); // ensure iOS is unlocked

      const now = audioCtx.currentTime;

      const phrase = [
        { m: 72, t: 0.00, d: 0.22 }, // C5
        { m: 76, t: 0.24, d: 0.22 }, // E5
        { m: 79, t: 0.48, d: 0.26 }, // G5
        { m: 84, t: 0.78, d: 0.42 }, // C6
        { m: 83, t: 1.24, d: 0.22 }, // B5
        { m: 84, t: 1.48, d: 0.34 }, // C6
        { m: 79, t: 1.88, d: 0.24 }, // G5
        { m: 76, t: 2.14, d: 0.24 }, // E5
        { m: 72, t: 2.40, d: 0.55 }, // C5 hold
      ];

      // compressor to keep it loud but not harsh
      const comp = audioCtx.createDynamicsCompressor();
      comp.threshold.setValueAtTime(-18, now);
      comp.knee.setValueAtTime(18, now);
      comp.ratio.setValueAtTime(6, now);
      comp.attack.setValueAtTime(0.006, now);
      comp.release.setValueAtTime(0.16, now);
      comp.connect(audioCtx.destination);

      const master = audioCtx.createGain();
      master.gain.setValueAtTime(0.0001, now);
      master.gain.exponentialRampToValueAtTime(1.7, now + 0.05); // louder
      master.gain.exponentialRampToValueAtTime(0.001, now + 3.8); // longer tail
      master.connect(comp);

      const filter = audioCtx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.setValueAtTime(2400, now);
      filter.Q.setValueAtTime(0.85, now);
      filter.connect(master);

      const vibratoOsc = audioCtx.createOscillator();
      vibratoOsc.type = "sine";
      vibratoOsc.frequency.setValueAtTime(5.2, now);

      const vibratoGain = audioCtx.createGain();
      vibratoGain.gain.setValueAtTime(11, now);
      vibratoOsc.connect(vibratoGain);

      function scheduleVoice(semitoneOffset, level, type) {
        for (const n of phrase) {
          const start = now + n.t;
          const end = start + n.d;

          const osc = audioCtx.createOscillator();
          osc.type = type;
          osc.frequency.setValueAtTime(midiToFreq(n.m + semitoneOffset), start);

          vibratoGain.connect(osc.frequency);

          const g = audioCtx.createGain();
          g.gain.setValueAtTime(0.0001, start);
          g.gain.exponentialRampToValueAtTime(level, start + 0.035);
          g.gain.exponentialRampToValueAtTime(0.0001, end);

          osc.connect(g);
          g.connect(filter);

          osc.start(start);
          osc.stop(end + 0.03);
        }
      }

      // brass-ish stack
      scheduleVoice(0, 0.78, "sawtooth");
      scheduleVoice(-12, 0.42, "sawtooth");
      scheduleVoice(0, 0.18, "square"); // adds bite

      vibratoOsc.start(now);
      vibratoOsc.stop(now + 4.0);
    }

    // ===========================
    // Render / UI
    // ===========================
    function updateCountDisplay() {
      const filledCount = states.filter(Boolean).length;
      filledCountSpan.textContent = filledCount;
      return filledCount;
    }

    function render() {
      dynDefs.textContent = "";
      sliceBaseLayer.textContent = "";
      unfilledPepperoniLayer.textContent = "";
      coloredPepperoniLayer.textContent = "";
      outlineLayer.textContent = "";
      dividerLayer.textContent = "";
      hitLayer.textContent = "";

      for (let i = 0; i < NUM_SLICES; i++) {
        const a1 = START_OFFSET + i * STEP;
        const a2 = START_OFFSET + (i + 1) * STEP;

        const clipId = `clip_slice_${i}`;
        const clip = makeSVG("clipPath");
        clip.setAttribute("id", clipId);
        const clipShape = makeSVG("path");
        clipShape.setAttribute("d", wedgePathPointCenter(R_PIZZA, a1, a2));
        clip.appendChild(clipShape);
        dynDefs.appendChild(clip);

        // base fill
        const base = makeSVG("path");
        base.setAttribute("d", wedgePathPointCenter(R_PIZZA, a1, a2));
        base.setAttribute("fill", states[i] ? "url(#cheeseGradient)" : "white");
        base.setAttribute("stroke", "none");
        sliceBaseLayer.appendChild(base);

        // UNFILLED: draw white-filled pepperoni within this slice (so it looks like a coloring page)
        if (!states[i]) {
          const g = makeSVG("g");
          g.setAttribute("clip-path", `url(#${clipId})`);
          for (const p of PEPPERONI_POSITIONS) {
            // white fill + black outline
            pepperoniCircle(g, p.x, p.y, p.r, "white", "#111", "1.7");
          }
          unfilledPepperoniLayer.appendChild(g);
        }

        // FILLED: draw colored pepperoni within this slice
        if (states[i]) {
          const coloredGroup = makeSVG("g");
          coloredGroup.setAttribute("clip-path", `url(#${clipId})`);

          const sauce = makeSVG("path");
          sauce.setAttribute("d", wedgePathPointCenter(R_PIZZA, a1, a2));
          sauce.setAttribute("fill", "url(#sauceGradient)");
          sauce.setAttribute("opacity", "0.12");
          coloredGroup.appendChild(sauce);

          for (const p of PEPPERONI_POSITIONS) {
            pepperoniColor(coloredGroup, p.x, p.y, p.r);
          }
          coloredPepperoniLayer.appendChild(coloredGroup);
        }

        // divider line
        const pOuter = polarToXY(R_PIZZA, a1);
        const line = makeSVG("line");
        line.setAttribute("x1", CX); line.setAttribute("y1", CY);
        line.setAttribute("x2", pOuter.x); line.setAttribute("y2", pOuter.y);
        line.setAttribute("stroke", "#111");
        line.setAttribute("stroke-width", "1.4");
        line.setAttribute("opacity", "0.75");
        dividerLayer.appendChild(line);

        // tap target
        const hit = makeSVG("path");
        hit.setAttribute("d", wedgePathPointCenter(R_PIZZA, a1, a2));
        hit.setAttribute("class", "slice-hit");
        hit.setAttribute("role", "button");
        hit.setAttribute("tabindex", "0");
        hit.setAttribute("aria-label", `Slice ${i + 1}`);

        const toggle = () => {
          unlockAudio();
          states[i] = !states[i];
          saveSliceStates(states);
          updateCountDisplay();
          render();
          checkCompletion(true);
        };

        hit.addEventListener("click", toggle);
        hit.addEventListener("touchstart", (e) => { e.preventDefault(); toggle(); }, { passive:false });
        hit.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
        });
        hitLayer.appendChild(hit);
      }

      // Global outline (stroke-only, like a coloring page)
      const crustOuter = makeSVG("circle");
      crustOuter.setAttribute("cx", CX);
      crustOuter.setAttribute("cy", CY);
      crustOuter.setAttribute("r", R_CRUST_OUT);
      crustOuter.setAttribute("fill", "none");
      crustOuter.setAttribute("stroke", "#111");
      crustOuter.setAttribute("stroke-width", "1.6");
      crustOuter.setAttribute("opacity", "0.95");
      outlineLayer.appendChild(crustOuter);

      const crustInner = makeSVG("circle");
      crustInner.setAttribute("cx", CX);
      crustInner.setAttribute("cy", CY);
      crustInner.setAttribute("r", R_CRUST_IN);
      crustInner.setAttribute("fill", "none");
      crustInner.setAttribute("stroke", "#111");
      crustInner.setAttribute("stroke-width", "1.4");
      crustInner.setAttribute("opacity", "0.90");
      outlineLayer.appendChild(crustInner);

      const cheeseEdge = makeSVG("path");
      cheeseEdge.setAttribute("d", buildWavyCheeseEdgePath(R_CHEESE_WAVY, 10));
      cheeseEdge.setAttribute("fill", "none");
      cheeseEdge.setAttribute("stroke", "#111");
      cheeseEdge.setAttribute("stroke-width", "1.4");
      cheeseEdge.setAttribute("opacity", "0.90");
      outlineLayer.appendChild(cheeseEdge);

      const cheeseBoundary = makeSVG("circle");
      cheeseBoundary.setAttribute("cx", CX);
      cheeseBoundary.setAttribute("cy", CY);
      cheeseBoundary.setAttribute("r", R_PIZZA);
      cheeseBoundary.setAttribute("fill", "none");
      cheeseBoundary.setAttribute("stroke", "#111");
      cheeseBoundary.setAttribute("stroke-width", "1.4");
      cheeseBoundary.setAttribute("opacity", "0.90");
      outlineLayer.appendChild(cheeseBoundary);

      // pepperoni outline stroke-only on top (keeps the “coloring page” look without blocking red)
      const pepStrokeG = makeSVG("g");
      pepStrokeG.setAttribute("fill", "none");
      pepStrokeG.setAttribute("stroke", "#111");
      pepStrokeG.setAttribute("stroke-width", "1.7");
      pepStrokeG.setAttribute("opacity", "0.92");

      for (const p of PEPPERONI_POSITIONS) {
        const c = makeSVG("circle");
        c.setAttribute("cx", p.x);
        c.setAttribute("cy", p.y);
        c.setAttribute("r", p.r);
        pepStrokeG.appendChild(c);
      }
      outlineLayer.appendChild(pepStrokeG);
    }

    function checkCompletion(fromUserGesture) {
      const allFilled = states.every(Boolean);
      if (allFilled && !wasAllFilled && fromUserGesture) {
        playFanfare();
      }
      wasAllFilled = allFilled;
      if (allFilled) showCompletionModal();
    }

    function showCompletionModal() {
      completionModal.classList.add("show");
      triggerConfetti();
    }

    function closeModal() { completionModal.classList.remove("show"); }

    function resetPizza() {
      unlockAudio();
      states = Array(NUM_SLICES).fill(false);
      saveSliceStates(states);
      wasAllFilled = false;
      updateCountDisplay();
      closeModal();
      render();
    }

    function fillAllSlices() {
      unlockAudio();
      const was = states.every(Boolean);
      states = Array(NUM_SLICES).fill(true);
      saveSliceStates(states);
      updateCountDisplay();
      render();
      wasAllFilled = was;
      checkCompletion(true);
    }

    btnReset.addEventListener("click", resetPizza);
    btnFill.addEventListener("click", fillAllSlices);
    btnClose.addEventListener("click", closeModal);
    btnResetModal.addEventListener("click", resetPizza);

    // Extra iOS safety: unlock on first interaction anywhere
    window.addEventListener("pointerdown", unlockAudio, { once: true });
    window.addEventListener("touchstart", unlockAudio, { once: true, passive: true });

    function triggerConfetti() {
      document.querySelectorAll(".confetti").forEach(el => el.remove());
      const colors = ["#ff6b6b","#51cf66","#4c6ef5","#ffd43b","#ff922b"];
      const confettiPieces = 55;

      for (let i = 0; i < confettiPieces; i++) {
        setTimeout(() => {
          const c = document.createElement("div");
          c.className = "confetti";
          c.textContent = Math.random() > 0.5 ? "🎉" : "🎊";
          c.style.left = (Math.random() * window.innerWidth) + "px";
          c.style.top = "-12px";
          c.style.color = colors[Math.floor(Math.random() * colors.length)];
          c.style.fontSize = (Math.random() * 18 + 18) + "px";
          c.style.opacity = "1";
          c.style.animation = `confettiFall ${Math.random() * 2 + 2.2}s ease-out forwards`;
          c.style.transform = `rotate(${Math.random() * 360}deg)`;
          document.body.appendChild(c);
          setTimeout(() => c.remove(), 3600);
        }, i * 28);
      }
    }

    // Init
    updateCountDisplay();
    render();
    checkCompletion(false);
  </script>
</body>
</html>
